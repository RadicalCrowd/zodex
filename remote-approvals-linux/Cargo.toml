[package]
name = "codex-remote-approvals-linux"
version = "0.1.0-linux-alpha1"
edition = "2021"
license = "MIT"
description = "Fail-closed protocol core for Zodex Remote Approvals v1"

[lib]
name = "codex_remote_approvals_linux"
path = "src/lib.rs"

[[bin]]
name = "codex-remote-approvals-linux"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
hpke = { version = "0.13.0", features = ["p256"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.9.5", features = ["os_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.1.0"
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.11"
time = { version = "0.3.37", features = ["parsing", "formatting", "macros"] }
uuid = { version = "1.12.1", features = ["serde", "v4"] }

[dev-dependencies]
hex = "0.4.3"
