[package]
name = "zodex-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only Zodex control-plane client and diagnostics"

[[bin]]
name = "zodex"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.11"
toml = "1.1.2"
zodex-control-plane = { path = "../zodex-control-plane" }

[dev-dependencies]
tempfile = "3.27.0"
