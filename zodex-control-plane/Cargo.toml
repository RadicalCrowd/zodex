[package]
name = "zodex-control-plane"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-only Zodex authority, encrypted store, and transaction core"

[[bin]]
name = "zodex-control-plane"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.102"
argon2 = "0.5.3"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.178"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.11"
tungstenite = "0.29.0"
zeroize = "1.8.1"

[dev-dependencies]
tempfile = "3.27.0"
