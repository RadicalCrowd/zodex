[package]
name = "codex-privileged-exec-linux"
version = "0.1.0-linux-research1"
edition = "2021"
description = "Fail-closed structured privileged-exec MCP runner for Zodex research"
license = "MIT"

[lib]
name = "codex_privileged_exec_linux"
path = "src/lib.rs"

[[bin]]
name = "codex-privileged-exec-linux"
path = "src/main.rs"

[features]
# Enable process-group management and deadline enforcement (Linux-only syscalls).
process-control = []

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
libc = "0.2"
rmcp = { version = "1.5.0", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["macros", "process", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "process", "rt", "rt-multi-thread", "time"] }
hex = "0.4.3"
